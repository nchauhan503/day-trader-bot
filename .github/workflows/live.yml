name: live

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Accepted so the cron body can stay unchanged. Unused."
        type: boolean
        default: true

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Execute against the tip of main, not the ref this run was created
          # with. A dispatch waiting for a runner would otherwise run against a
          # checkout from minutes or hours earlier, with a stale positions.json.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Morning report, then one intraday pass
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p trader
          python - <<'PY'
          import json, os
          p = "trader/config.json"
          d = {}
          if os.environ.get("SEC_USER_AGENT"):
              d["sec_user_agent"] = os.environ["SEC_USER_AGENT"]
          if os.environ.get("NTFY_TOPIC"):
              d["ntfy_topic"] = os.environ["NTFY_TOPIC"]
          if d:
              json.dump(d, open(p, "w"))
          PY
          python live.py

      - name: Publish whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Do not name an ignored path here: git aborts the whole add with
          # exit 128 and stages nothing, which silently stopped every publish
          # from 2026-11-06 and re-sent the morning report on every run.
          git add report signals.json report/live.txt
          git diff --cached --quiet && echo "nothing to publish" && exit 0
          git commit -m "live: $(TZ=America/Los_Angeles date +%Y-%m-%d\ %H:%M)"
          # main can move while this job waits for a runner. The report files
          # are regenerated every pass from the same bars, so a conflict there
          # is not a real disagreement -- keep the version this run just wrote
          # instead of failing the job and losing the publish. (This is what
          # failed run 43918149116 on 2026-11-16.)
          if ! git pull --rebase origin main; then
            git diff --name-only --diff-filter=U | while read -r f; do
              case "$f" in
                report/*|signals.json) git checkout --theirs -- "$f" && git add "$f" ;;
              esac
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push

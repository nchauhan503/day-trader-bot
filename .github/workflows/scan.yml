name: premarket-scan

on:
  schedule:
    # Best-effort backstop only: GitHub can fire these hours late, so this is
    # not the primary 5am trigger. run_scan.py takes the first run of the
    # Pacific day and skips the rest, so a late run still delivers a report.
    - cron: "0 12,13,14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it is not 5am Pacific (manual test)"
        type: boolean
        default: true

concurrency:
  group: premarket-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and write report
        env:
          # Optional: set the repo secret so SEC filings are included.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then
            mkdir -p trader
            python -c "import json,os;json.dump({'sec_user_agent':os.environ['SEC_USER_AGENT']},open('trader/config.json','w'))"
          fi
          python run_scan.py ${{ inputs.force && '--force' || '' }}

      - name: Publish report to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report
          git diff --cached --quiet && echo "report unchanged" && exit 0
          git commit -m "scan: $(TZ=America/Los_Angeles date +%Y-%m-%d)"
          git push
